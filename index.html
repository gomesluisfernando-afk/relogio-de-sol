<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Relógio de Sol</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/ui/icon-192.png">
<link rel="apple-touch-icon" href="assets/img/ui/icon-192.png">
<style>
  /* Lilita One (títulos e botões) e Nunito (textos): SIL Open Font License, servidas pelo próprio jogo para funcionar offline */
  @font-face { font-family: 'Lilita One'; font-style: normal; font-weight: 400; font-display: block; src: url(assets/fonts/lilita-one.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 800; font-display: block; src: url(assets/fonts/nunito-800.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 900; font-display: block; src: url(assets/fonts/nunito-900.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #app { position: fixed; left: 50%; top: 50%; width: 960px; height: 540px; transform-origin: 50% 50%; }
  canvas { position: relative; z-index: 2; width: 100%; height: 100%; display: block; }
  #vid { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #000; }
</style>
</head>
<body>
<div id="app"><canvas id="c" width="960" height="540"></canvas><video id="vid" playsinline muted></video></div>
<script src="lang.data.js"></script>
<script src="i18n.js"></script>
<script src="content.data.js"></script>
<script src="assets.data.js"></script>
<script src="maps/hoje.js"></script>
<script src="maps/eras.js"></script>
<script src="cutscenes.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
<script src="minis.js"></script>
</body>
</html>
