<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relógio de Sol · Debug</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #eee; --dim: #999; --line: #333; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 24px 0 8px; padding: 6px 10px; border-radius: 6px; color: #fff; }
  .sum { color: var(--dim); margin-bottom: 12px; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .box li { margin: 2px 0; }
  .err { border-color: #c33; } .warn { border-color: #b80; } .chk { border-color: #48c; }
  details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 4px; vertical-align: middle; }
  .doc { background: #2a6; } .debatido { background: #a72; } .lenda { background: #d60; } .conferir { background: #46c; } .serio { background: #555; } .usa { background: #335; }
  .hook { font-size: 18px; margin: 8px 0; }
  .lbl { color: var(--dim); font-size: 13px; margin-top: 6px; }
  ul { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>
<h1>Relógio de Sol · Debug</h1>
<div class="sum" id="sum">Carregando…</div>
<div id="report"></div>
<div id="cards"></div>
<script type="module">
  import { loadContent, validate } from './src/content.js';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const list = (cls, title, items) => items.length
    ? `<div class="box ${cls}"><b>${title} (${items.length})</b><ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>` : '';
  try {
    const c = await loadContent();
    const r = validate(c);
    const usa = c.cards.filter((k) => k.usa).length;
    document.getElementById('sum').textContent =
      `${c.cards.length} cards · ${c.eras.length} eras · ${c.tours[0].stops.length} paradas · ${c.expressions.length} expressões · ${c.characters.length} personagens · ${usa} conexões EUA`;
    document.getElementById('report').innerHTML =
      list('err', 'Erros', r.errors) + list('warn', 'Avisos', r.warnings) +
      list('chk', 'Conferir', r.conferir.map((q) => `${q.id}: ${q.text}`)) +
      (r.errors.length ? '' : '<div class="box doc" style="background:none">✔ Nenhum erro.</div>');
    document.getElementById('cards').innerHTML = c.eras.map((e) => {
      const cards = c.cards.filter((k) => k.era === e.id);
      return `<h2 style="background:${e.color}">${esc(e.ageLabel)} · ${esc(e.name)} (${cards.length})</h2>` + cards.map((k) => `
        <details>
          <summary><b>${k.id}</b> · ${esc(k.yearLabel)} · ${esc(k.title)}
            <span class="tag ${k.status}">${k.status.toUpperCase()}</span>
            ${k.tone === 'serio' ? '<span class="tag serio">SÉRIO</span>' : ''}
            ${k.usa ? '<span class="tag usa">🇺🇸</span>' : ''}</summary>
          <div class="hook">“${esc(k.hook)}”</div>
          <div class="lbl">Fatos</div><ul>${k.facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
          <div class="lbl">Tour (${k.tourStops.join(', ') || 'fora do tour'}) · pânico: ${esc(k.keyword)}</div><ul>${k.bullets.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>
          ${k.joke ? `<div class="lbl">😂 Piada</div><div>${esc(k.joke)}</div>` : ''}
          ${k.usa ? `<div class="lbl">🇺🇸 ${esc(k.usaTitle)}</div><div>${esc(k.usa)}</div>` : ''}
          ${k.notes ? `<div class="lbl">Notas de status</div><ul>${k.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
        </details>`).join('');
    }).join('');
  } catch (err) {
    document.getElementById('sum').textContent = 'Erro ao carregar: ' + err.message;
  }
</script>
</body>
</html>
